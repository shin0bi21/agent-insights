services:
  app:
    build:
      context: .
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.147.0}
    image: repo-automation-score:local
    init: true
    ports:
      - "127.0.0.1:${RAS_PORT:-4173}:4173"
    environment:
      NODE_ENV: production
      REPO_AUTOMATION_SCORE_HOST: 0.0.0.0
      REPO_AUTOMATION_SCORE_DB_PATH: /data/repo-automation-score.sqlite
      BENCHMARK_WEB_PORT: 4173
      TMPDIR: ${RAS_RUNTIME_PATH:?Copy .env.example to .env and set RAS_RUNTIME_PATH}
      HOME: /root
      CODEX_HOME: /root/.codex
    volumes:
      - type: volume
        source: app_data
        target: /data
      - type: volume
        source: codex_state
        target: /root/.codex
      - type: bind
        source: ${RAS_REPOSITORY_PATH:?Copy .env.example to .env and set RAS_REPOSITORY_PATH}
        target: ${RAS_REPOSITORY_PATH:?Copy .env.example to .env and set RAS_REPOSITORY_PATH}
      - type: bind
        source: ${RAS_RUNTIME_PATH:?Copy .env.example to .env and set RAS_RUNTIME_PATH}
        target: ${RAS_RUNTIME_PATH:?Copy .env.example to .env and set RAS_RUNTIME_PATH}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4173/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  app_data:
  codex_state:
