name: agent-automation-score

services:
  app:
    build:
      context: .
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.147.0}
    image: agent-automation-score:local
    init: true
    ports:
      - "127.0.0.1:${AAS_PORT:-${RAS_PORT:-4173}}:4173"
    environment:
      NODE_ENV: production
      AGENT_AUTOMATION_SCORE_HOST: 0.0.0.0
      AGENT_AUTOMATION_SCORE_DB_PATH: /data/agent-automation-score.sqlite
      BENCHMARK_WEB_PORT: 4173
      AAS_REPOSITORY_PATH: ${AAS_REPOSITORY_PATH:-${RAS_REPOSITORY_PATH}}
      TMPDIR: ${AAS_RUNTIME_PATH:-${RAS_RUNTIME_PATH}}
      HOME: /root
      CODEX_HOME: /root/.codex
    volumes:
      - type: volume
        source: app_data
        target: /data
      - type: volume
        source: codex_state
        target: /root/.codex
      - type: bind
        source: ${AAS_REPOSITORY_PATH:-${RAS_REPOSITORY_PATH}}
        target: ${AAS_REPOSITORY_PATH:-${RAS_REPOSITORY_PATH}}
      - type: bind
        source: ${AAS_RUNTIME_PATH:-${RAS_RUNTIME_PATH}}
        target: ${AAS_RUNTIME_PATH:-${RAS_RUNTIME_PATH}}
      # /dev/null keeps host Docker unavailable by default. Set this to the
      # daemon socket only for trusted repositories that launch containers.
      - type: bind
        source: ${AAS_DOCKER_SOCKET_PATH:-${RAS_DOCKER_SOCKET_PATH:-/dev/null}}
        target: /var/run/docker.sock
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4173/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5

volumes:
  app_data:
    name: ${AAS_APP_DATA_VOLUME:-${RAS_APP_DATA_VOLUME:-repo-automation-score_app_data}}
  codex_state:
    name: ${AAS_CODEX_STATE_VOLUME:-${RAS_CODEX_STATE_VOLUME:-repo-automation-score_codex_state}}
